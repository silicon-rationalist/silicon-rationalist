<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 175" width="100%" height="auto" style="width: 100%; height: auto; display: block;">
  <defs>
    <radialGradient id="seatlas-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#241344"/>
      <stop offset="55%" stop-color="#180b2e"/>
      <stop offset="100%" stop-color="#10061e"/>
    </radialGradient>
    <linearGradient id="seatlas-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.2"/>
      <stop offset="30%" stop-color="#f472b6" stop-opacity="0.9">
        <animate attributeName="offset" values="0.1;0.6;0.1" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="60%" stop-color="#f0abfc" stop-opacity="0.85">
        <animate attributeName="offset" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="800" height="175" rx="10" fill="url(#seatlas-bg)" stroke="#c084fc" stroke-width="1" stroke-opacity="0.45"/>
  <line x1="30" y1="1" x2="770" y2="1" stroke="url(#seatlas-glow)" stroke-width="2"/>

  <!-- Top Bar -->
  <line x1="0" y1="36" x2="800" y2="36" stroke="#a855f7" stroke-width="0.7" stroke-opacity="0.25"/>
  <circle cx="24" cy="18" r="4" fill="#f472b6" opacity="0.9"/>
  <circle cx="37" cy="18" r="4" fill="#c084fc" opacity="0.75"/>
  <circle cx="50" cy="18" r="4" fill="#7c3aed" opacity="0.6"/>
  <text x="68" y="22" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="11.5" font-weight="700" fill="#f472b6" letter-spacing="1.5">UTILITY // WEB // SPATIAL DATA</text>

  <!-- Interactive Live Indicator -->
  <g transform="translate(675, 18)">
    <circle cx="0" cy="0" r="4" fill="#10b981"/>
    <circle cx="0" cy="0" r="4" fill="none" stroke="#10b981" stroke-width="1.2">
      <animate attributeName="r" values="3;9;3" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="12" y="4" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="11.5" font-weight="700" fill="#34d399" letter-spacing="1">LIVE DEMO ↗</text>
  </g>

  <!-- Project Title -->
  <text x="24" y="66" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="19" font-weight="700" fill="#ffffff">◈ SEATLAS <tspan fill="#f472b6">↗</tspan></text>

  <!-- Details Content -->
  <text x="24" y="93" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13.5" fill="#f5f3ff">Map-based college explorer &amp; decision engine. Cutoff percentiles, ROI analysis,</text>
  <text x="24" y="115" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13.5" fill="#ddd6fe">and daily commute planning unified into a clean, interactive spatial map.</text>

  <!-- Tech Stack Container -->
  <rect x="24" y="132" width="752" height="30" rx="5" fill="#150a2b" stroke="#f472b6" stroke-width="0.5" stroke-opacity="0.35"/>
  <text x="36" y="152" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="11" font-weight="700" fill="#f472b6" letter-spacing="1.5">STACK</text>
  <text x="96" y="152" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="12.5" fill="#ffffff">TypeScript <tspan fill="#f0abfc">·</tspan> Leaflet <tspan fill="#f0abfc">·</tspan> GeoJSON <tspan fill="#f0abfc">·</tspan> Vercel <tspan fill="#f0abfc">·</tspan> OpenStreetMap</text>
</svg>
