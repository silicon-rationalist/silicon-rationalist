<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="100%" height="auto" style="width: 100%; height: auto; display: block;">
  <defs>
    <radialGradient id="jingleg-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#241344"/>
      <stop offset="55%" stop-color="#180b2e"/>
      <stop offset="100%" stop-color="#10061e"/>
    </radialGradient>
    <linearGradient id="jingleg-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="35%" stop-color="#f472b6" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#f0abfc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Lighter Purple & Pink Tile Card -->
  <rect width="420" height="220" rx="8" fill="url(#jingleg-bg)" stroke="#c084fc" stroke-width="1" stroke-opacity="0.45"/>
  <line x1="20" y1="1" x2="400" y2="1" stroke="url(#jingleg-glow)" stroke-width="2"/>

  <!-- Header Bar -->
  <line x1="0" y1="34" x2="420" y2="34" stroke="#a855f7" stroke-width="0.6" stroke-opacity="0.3"/>
  <circle cx="20" cy="18" r="3.5" fill="#f472b6" opacity="0.9"/>
  <circle cx="31" cy="18" r="3.5" fill="#c084fc" opacity="0.75"/>
  <circle cx="42" cy="18" r="3.5" fill="#7c3aed" opacity="0.6"/>
  <text x="56" y="22" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="10.5" font-weight="700" fill="#f472b6" letter-spacing="1.2">EXPERIMENT // GAME</text>

  <!-- Repo Status Badge -->
  <text x="362" y="22" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="10.5" font-weight="600" fill="#c4b5fd" letter-spacing="1">REPO</text>

  <!-- Project Title -->
  <text x="20" y="58" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="16" font-weight="700" fill="#ffffff">◈ JINGLE MATCHER genesis <tspan fill="#f472b6">↗</tspan></text>

  <!-- Details Box -->
  <rect x="16" y="68" width="388" height="86" rx="6" fill="#130826" stroke="#c084fc" stroke-width="0.5" stroke-opacity="0.35"/>
  <text x="28" y="91" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="12" fill="#f5f3ff">Original Secret Santa assignment tool.</text>
  <text x="28" y="111" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="12" fill="#e9d5ff">No rigged paper slips — pure deterministic</text>
  <text x="28" y="131" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="12" fill="#ddd6fe">randomization where the concept began.</text>

  <!-- Tech Stack Box -->
  <rect x="16" y="164" width="388" height="38" rx="6" fill="#190c33" stroke="#f472b6" stroke-width="0.5" stroke-opacity="0.35"/>
  <text x="28" y="188" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="10.5" font-weight="700" fill="#f472b6" letter-spacing="1">STACK</text>
  <text x="76" y="188" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="11.5" fill="#ffffff">Python <tspan fill="#f0abfc">·</tspan> Pygame <tspan fill="#f0abfc">·</tspan> Discrete Logic</text>
</svg>
