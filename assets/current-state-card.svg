<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 365" width="100%" height="auto" style="width: 100%; height: auto; display: block;">
  <defs>
    <radialGradient id="cs-card-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#190e30"/>
      <stop offset="55%" stop-color="#100a22"/>
      <stop offset="100%" stop-color="#080414"/>
    </radialGradient>
    <linearGradient id="cs-top-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="25%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#f472b6" stop-opacity="0.85"/>
      <stop offset="75%" stop-color="#c084fc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="365" rx="10" fill="url(#cs-card-bg)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.35"/>
  <line x1="30" y1="1" x2="770" y2="1" stroke="url(#cs-top-glow)" stroke-width="1.8"/>

  <!-- Terminal Controls in Celestial Pink and Purple Palette -->
  <line x1="0" y1="36" x2="800" y2="36" stroke="#7c3aed" stroke-width="0.75" stroke-opacity="0.25"/>
  <circle cx="24" cy="18" r="4.5" fill="#f472b6" opacity="0.9"/>
  <circle cx="39" cy="18" r="4.5" fill="#c084fc" opacity="0.75"/>
  <circle cx="54" cy="18" r="4.5" fill="#7c3aed" opacity="0.6"/>
  <text x="76" y="22" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="12" font-weight="700" fill="#f472b6" letter-spacing="1.5">&gt; CURRENT STATE // TELEMETRY</text>

  <!-- Uniform Equal Grid Layout (2x2 Balanced Quadrants) -->
  <g transform="translate(32, 54)">
    <!-- Quadrant 1: BUILDING (Col 1, Row 1) -->
    <g transform="translate(0, 0)">
      <rect width="356" height="134" rx="6" fill="#0d081c" stroke="#f472b6" stroke-width="0.5" stroke-opacity="0.4"/>
      <text x="20" y="28" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="12" font-weight="700" fill="#f472b6" letter-spacing="2">// BUILDING</text>
      <text x="20" y="55" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="15" font-weight="600" fill="#ffffff">→ ANTARA</text>
      <text x="36" y="78" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="12.5" fill="#ddd6fe">adaptive learning platform</text>
      <text x="36" y="100" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="12.5" fill="#a78bfa">prep for SIH Hackathon</text>
    </g>

    <!-- Quadrant 2: EXPLORING (Col 2, Row 1) -->
    <g transform="translate(380, 0)">
      <rect width="356" height="134" rx="6" fill="#0d081c" stroke="#f472b6" stroke-width="0.5" stroke-opacity="0.4"/>
      <text x="20" y="28" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="12" font-weight="700" fill="#f472b6" letter-spacing="2">// EXPLORING</text>
      <text x="20" y="55" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="15" font-weight="600" fill="#ffffff">→ new tools &amp; frameworks</text>
      <text x="36" y="78" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="12.5" fill="#ddd6fe">figuring out what sticks</text>
      <text x="36" y="100" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="12.5" fill="#a78bfa">evaluating modern agent stacks</text>
    </g>

    <!-- Quadrant 3: UNDERSTANDING (Col 1, Row 2) -->
    <g transform="translate(0, 150)">
      <rect width="356" height="134" rx="6" fill="#0d081c" stroke="#f472b6" stroke-width="0.5" stroke-opacity="0.4"/>
      <text x="20" y="28" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="12" font-weight="700" fill="#f472b6" letter-spacing="2">// UNDERSTANDING</text>
      <text x="20" y="55" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="15" font-weight="600" fill="#ffffff">→ things that actually get used</text>
      <text x="36" y="78" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="12.5" fill="#ddd6fe">how to build lasting adoption</text>
      <text x="36" y="100" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="12.5" fill="#a78bfa">systems beyond the demo</text>
    </g>

    <!-- Quadrant 4: OPERATIONAL MODE (Col 2, Row 2) -->
    <g transform="translate(380, 150)">
      <rect width="356" height="134" rx="6" fill="#0d081c" stroke="#f472b6" stroke-width="0.5" stroke-opacity="0.4"/>
      <text x="20" y="28" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="12" font-weight="700" fill="#f472b6" letter-spacing="2">// OPERATIONAL MODE</text>
      <text x="20" y="55" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="15" font-weight="600" fill="#ffffff">→ build first, optimize later</text>
      <g transform="translate(20, 77)">
        <circle cx="6" cy="0" r="3.5" fill="#10b981">
          <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text x="18" y="4" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="12" font-weight="600" fill="#34d399" letter-spacing="1">STATUS: ACTIVE COMPILATION</text>
      </g>
      <text x="36" y="103" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="12.5" fill="#a78bfa">continuous iteration cycle</text>
    </g>
  </g>
</svg>
