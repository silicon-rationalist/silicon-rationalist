<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="100%" height="auto" style="width: 100%; height: auto; display: block;">
  <defs>
    <radialGradient id="cs-card-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#190e30"/>
      <stop offset="55%" stop-color="#100a22"/>
      <stop offset="100%" stop-color="#080414"/>
    </radialGradient>
    <linearGradient id="cs-top-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="25%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#f472b6" stop-opacity="0.85"/>
      <stop offset="75%" stop-color="#c084fc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="370" rx="10" fill="url(#cs-card-bg)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.35"/>
  <line x1="30" y1="1" x2="770" y2="1" stroke="url(#cs-top-glow)" stroke-width="1.8"/>

  <!-- Red, Yellow, Green Terminal Controls -->
  <line x1="0" y1="36" x2="800" y2="36" stroke="#7c3aed" stroke-width="0.75" stroke-opacity="0.25"/>
  <circle cx="24" cy="18" r="4.5" fill="#ff5f56"/>
  <circle cx="39" cy="18" r="4.5" fill="#ffbd2e"/>
  <circle cx="54" cy="18" r="4.5" fill="#27c93f"/>
  <text x="76" y="22" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="12" font-weight="700" fill="#f472b6" letter-spacing="1.5">&gt; CURRENT STATE // TELEMETRY</text>

  <g transform="translate(32, 54)">
    <rect width="736" height="292" rx="6" fill="#0d081c" stroke="#f472b6" stroke-width="0.75" stroke-dasharray="4 3" opacity="0.5"/>

    <!-- Left Column: BUILDING in Pink -->
    <text x="24" y="34" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="12" font-weight="700" fill="#f472b6" letter-spacing="2">BUILDING</text>
    <text x="24" y="58" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="15" font-weight="600" fill="#ffffff">→ ANTARA</text>
    <text x="44" y="78" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13" fill="#c4b5fd">adaptive learning platform</text>
    <text x="44" y="96" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13" fill="#a78bfa">prep for SIH Hackathon</text>

    <!-- Left Column: EXPLORING in Pink -->
    <text x="24" y="132" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="12" font-weight="700" fill="#f472b6" letter-spacing="2">EXPLORING</text>
    <text x="24" y="156" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="15" font-weight="600" fill="#ffffff">→ new tools &amp; frameworks</text>
    <text x="44" y="176" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13" fill="#c4b5fd">figuring out what sticks</text>

    <!-- Left Column: TRYING TO UNDERSTAND in Pink -->
    <text x="24" y="212" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="12" font-weight="700" fill="#f472b6" letter-spacing="2">TRYING TO UNDERSTAND</text>
    <text x="24" y="236" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="15" font-weight="600" fill="#ffffff">→ how to make things that actually get used</text>
    <text x="44" y="256" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13" fill="#c4b5fd">systems beyond the demo</text>

    <!-- Right Column: MODE in Pink -->
    <text x="470" y="34" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="12" font-weight="700" fill="#f472b6" letter-spacing="2">MODE</text>
    <text x="470" y="58" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="15" font-weight="600" fill="#ffffff">→ build first, optimize later</text>
    <circle cx="704" cy="54" r="3.2" fill="#10b981">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="470" y="96" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="12" fill="#e879f9" letter-spacing="1">STATUS: ACTIVE COMPILATION</text>
  </g>
</svg>
