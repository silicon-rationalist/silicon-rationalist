<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" width="100%" height="auto" style="width: 100%; height: auto; display: block;">
  <defs>
    <radialGradient id="trans-card-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#160f2e"/>
      <stop offset="55%" stop-color="#0e0a20"/>
      <stop offset="100%" stop-color="#080514"/>
    </radialGradient>
    <linearGradient id="trans-top-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="30%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Deep Purple Card Background with Rounded Edges -->
  <rect width="800" height="230" rx="10" fill="url(#trans-card-bg)" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.35"/>
  <line x1="40" y1="1" x2="760" y2="1" stroke="url(#trans-top-glow)" stroke-width="1.5"/>

  <!-- Terminal Top Bar with Canonical Red, Yellow, Green Controls -->
  <line x1="0" y1="36" x2="800" y2="36" stroke="#7c3aed" stroke-width="0.75" stroke-opacity="0.25"/>
  <circle cx="24" cy="18" r="4.5" fill="#ff5f56"/>
  <circle cx="39" cy="18" r="4.5" fill="#ffbd2e"/>
  <circle cx="54" cy="18" r="4.5" fill="#27c93f"/>
  <text x="76" y="22" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="12" font-weight="700" fill="#c4b5fd" letter-spacing="1.5">&gt; TRANSMISSION // COMMUNICATIONS UPLINK</text>

  <!-- Inner Telemetry Frame -->
  <g transform="translate(32, 54)">
    <rect width="736" height="152" rx="6" fill="#0d091a" stroke="#7c3aed" stroke-width="0.5" opacity="0.6"/>

    <text x="24" y="32" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13" fill="#a78bfa">GH    <tspan fill="#ffffff">silicon-rationalist</tspan></text>
    <text x="24" y="58" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13" fill="#a78bfa">IN    <tspan fill="#ffffff">rakshan-s</tspan></text>
    <text x="24" y="84" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13" fill="#a78bfa">IG    <tspan fill="#ffffff">sweet_poison.exe</tspan></text>
    <text x="24" y="110" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13" fill="#a78bfa">MAIL  <tspan fill="#ffffff">rakshan.exe@gmail.com</tspan></text>

    <!-- Right Side Status -->
    <text x="460" y="36" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="12" fill="#a78bfa" letter-spacing="1">LOCATION</text>
    <text x="460" y="58" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="14" fill="#ffffff">BLR // BENGALURU, INDIA</text>
    <text x="460" y="96" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="12" fill="#a78bfa" letter-spacing="1">CARRIER FREQUENCY</text>
    <text x="460" y="116" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13" fill="#10b981">ONLINE // LISTENING</text>
  </g>
</svg>
