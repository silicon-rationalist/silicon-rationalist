<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 64" width="100%" height="auto" style="width: 100%; height: auto; display: block;">
  <style>
    @keyframes rot_orbit-divider-01 {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .star-rot-orbit-divider-01 {
      transform-origin: 0px 0px;
      animation: rot_orbit-divider-01 16s linear infinite;
    }
  </style>

  <defs>
    <!-- Deep Cosmic Space Void Background (matching header.svg) -->
    <radialGradient id="space-bg-orbit-divider-01" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0e0d1c"/>
      <stop offset="55%" stop-color="#080813"/>
      <stop offset="100%" stop-color="#04040a"/>
    </radialGradient>

    <!-- Linear Gradient fading to transparent left and right -->
    <linearGradient id="orbit-div-grad-orbit-divider-01" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0"/>
      <stop offset="12%" stop-color="#6d28d9" stop-opacity="0.15"/>
      <stop offset="28%" stop-color="#a78bfa" stop-opacity="0.45"/>
      <stop offset="44%" stop-color="#c4b5fd" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="56%" stop-color="#c4b5fd" stop-opacity="0.85"/>
      <stop offset="72%" stop-color="#a78bfa" stop-opacity="0.45"/>
      <stop offset="88%" stop-color="#6d28d9" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </linearGradient>

    <!-- Center Radial Glow -->
    <radialGradient id="center-glow-orbit-divider-01" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#8b5cf6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ═════════ ENCLOSED SPACE VOID CONTAINER (Guarantees dark purple across Light/Dark themes) ═════════ -->
  <rect width="800" height="64" rx="8" fill="url(#space-bg-orbit-divider-01)" stroke="#7c3aed" stroke-width="0.75" stroke-opacity="0.25"/>

  <!-- Ambient Center Aura -->
  <ellipse cx="400" cy="32" rx="120" ry="28" fill="url(#center-glow-orbit-divider-01)"/>

  <!-- Horizontal Beam with Left & Right Fade (Optical Glow Layer) -->
  <line x1="0" y1="32" x2="800" y2="32" stroke="url(#orbit-div-grad-orbit-divider-01)" stroke-width="2.8" opacity="0.3"/>

  <!-- Left & Right Fading Core Axis Line -->
  <line x1="0" y1="32" x2="800" y2="32" stroke="url(#orbit-div-grad-orbit-divider-01)" stroke-width="1.1"/>

  <!-- Subtle Vector Ticks & Coordinate Accents -->
  <g opacity="0.65" stroke="#a78bfa" stroke-width="0.75">
    <line x1="310" y1="30" x2="310" y2="34"/>
    <line x1="490" y1="30" x2="490" y2="34"/>
    <line x1="220" y1="30.5" x2="220" y2="33.5" opacity="0.45"/>
    <line x1="580" y1="30.5" x2="580" y2="33.5" opacity="0.45"/>
    <line x1="140" y1="31" x2="140" y2="33" opacity="0.25"/>
    <line x1="660" y1="31" x2="660" y2="33" opacity="0.25"/>
  </g>

  <!-- Flanking Orbit Dots with Fading Opacity -->
  <circle cx="340" cy="32" r="1.4" fill="#a78bfa" opacity="0.65"/>
  <circle cx="460" cy="32" r="1.4" fill="#a78bfa" opacity="0.65"/>
  <circle cx="280" cy="32" r="1.1" fill="#a78bfa" opacity="0.45"/>
  <circle cx="520" cy="32" r="1.1" fill="#a78bfa" opacity="0.45"/>
  <circle cx="180" cy="32" r="0.9" fill="#6d28d9" opacity="0.3"/>
  <circle cx="620" cy="32" r="0.9" fill="#6d28d9" opacity="0.3"/>

  <!-- Tiny Background Star Particles -->
  <circle cx="380" cy="19" r="0.8" fill="#ffffff" opacity="0.45">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="424" cy="46" r="0.7" fill="#c4b5fd" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="360" cy="44" r="0.6" fill="#a78bfa" opacity="0.35"/>
  <circle cx="440" cy="20" r="0.6" fill="#ffffff" opacity="0.35"/>
  <circle cx="260" cy="22" r="0.6" fill="#e2e8f0" opacity="0.3"/>
  <circle cx="540" cy="42" r="0.6" fill="#c4b5fd" opacity="0.3"/>

  <!-- ═════════ CENTER ORBITAL ASSEMBLY ═════════ -->
  <g transform="translate(400, 32)">
    <!-- Elliptical Orbit Track with Dynamic Tilt -->
    <ellipse rx="76" ry="18" transform="rotate(-4)" fill="none" stroke="#a78bfa" stroke-width="0.8" stroke-dasharray="3 3.5" opacity="0.35"/>

    <!-- Center Rotating 5-Pointed Star Bit -->
    <g class="star-rot-orbit-divider-01">
      <!-- Soft Core Glow Behind Star -->
      <circle r="14" fill="#8b5cf6" opacity="0.28"/>
      <!-- 10 Facets for 3D Gemstone Depth -->
      <polygon points="0,0 0.0,-12.0 3.06,-4.21" fill="#ffffff"/> <polygon points="0,0 3.06,-4.21 11.41,-3.71" fill="#ddd6fe"/> <polygon points="0,0 11.41,-3.71 4.95,1.61" fill="#a78bfa"/> <polygon points="0,0 4.95,1.61 7.05,9.71" fill="#7c3aed"/> <polygon points="0,0 7.05,9.71 0.0,5.2" fill="#5b21b6"/> <polygon points="0,0 0.0,5.2 -7.05,9.71" fill="#7c3aed"/> <polygon points="0,0 -7.05,9.71 -4.95,1.61" fill="#a78bfa"/> <polygon points="0,0 -4.95,1.61 -11.41,-3.71" fill="#ddd6fe"/> <polygon points="0,0 -11.41,-3.71 -3.06,-4.21" fill="#ffffff"/> <polygon points="0,0 -3.06,-4.21 0.0,-12.0" fill="#ddd6fe"/>
      <!-- Star-Bit Inner Facet Highlights -->
      <circle r="2.0" fill="#ffffff" opacity="0.95"/>
      <polygon points="0,-4.5 1.0,-1.0 4.5,0 1.0,1.0 0,4.5 -1.0,1.0 -4.5,0 -1.0,-1.0" fill="#ffffff" opacity="0.85"/>
    </g>

    <!-- Orbiting Satellite Body (Rotated with tilt) -->
    <g transform="rotate(-4)">
      
        <g>
          <circle r="4.5" fill="#a78bfa" opacity="0.3"/>
          <circle r="2.2" fill="#ffffff"/>
          <polygon points="0,-4.2 0.9,-0.9 4.2,0 0.9,0.9 0,4.2 -0.9,0.9 -4.2,0 -0.9,-0.9" fill="#ffffff" opacity="0.85"/>
          <animateMotion dur="16s" repeatCount="indefinite" path="M -76,0 a 76,18 0 1,0 152,0 a 76,18 0 1,0 -152,0"/>
        </g>
        
    </g>
  </g>
</svg>
