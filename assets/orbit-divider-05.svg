<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 64" width="100%" height="auto" style="width: 100%; height: auto; display: block;">
  <style>
    @keyframes rot_orbit-divider-05 {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .star-rot-orbit-divider-05 {
      transform-origin: 0px 0px;
      animation: rot_orbit-divider-05 19s linear infinite;
    }
  </style>

  <defs>
    <!-- Linear Gradient fading to transparent left and right -->
    <linearGradient id="orbit-div-grad-orbit-divider-05" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0"/>
      <stop offset="12%" stop-color="#0d9488" stop-opacity="0.18"/>
      <stop offset="28%" stop-color="#2dd4bf" stop-opacity="0.5"/>
      <stop offset="44%" stop-color="#5eead4" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#f0fdfa" stop-opacity="0.95"/>
      <stop offset="56%" stop-color="#5eead4" stop-opacity="0.85"/>
      <stop offset="72%" stop-color="#2dd4bf" stop-opacity="0.5"/>
      <stop offset="88%" stop-color="#0d9488" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </linearGradient>

    <!-- Center Radial Glow -->
    <radialGradient id="center-glow-orbit-divider-05" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.48"/>
      <stop offset="45%" stop-color="#14b8a6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Center Aura -->
  <ellipse cx="400" cy="32" rx="120" ry="28" fill="url(#center-glow-orbit-divider-05)"/>

  <!-- Horizontal Beam with Left & Right Fade (Optical Glow Layer) -->
  <line x1="0" y1="32" x2="800" y2="32" stroke="url(#orbit-div-grad-orbit-divider-05)" stroke-width="2.8" opacity="0.35"/>

  <!-- Left & Right Fading Core Axis Line -->
  <line x1="0" y1="32" x2="800" y2="32" stroke="url(#orbit-div-grad-orbit-divider-05)" stroke-width="1.2"/>

  <!-- Subtle Vector Ticks & Coordinate Accents -->
  <g opacity="0.7" stroke="#2dd4bf" stroke-width="0.75">
    <line x1="310" y1="30" x2="310" y2="34"/>
    <line x1="490" y1="30" x2="490" y2="34"/>
    <line x1="220" y1="30.5" x2="220" y2="33.5" opacity="0.45"/>
    <line x1="580" y1="30.5" x2="580" y2="33.5" opacity="0.45"/>
    <line x1="140" y1="31" x2="140" y2="33" opacity="0.25"/>
    <line x1="660" y1="31" x2="660" y2="33" opacity="0.25"/>
  </g>

  <!-- Flanking Orbit Dots with Fading Opacity -->
  <circle cx="340" cy="32" r="1.4" fill="#2dd4bf" opacity="0.7"/>
  <circle cx="460" cy="32" r="1.4" fill="#2dd4bf" opacity="0.7"/>
  <circle cx="280" cy="32" r="1.1" fill="#2dd4bf" opacity="0.5"/>
  <circle cx="520" cy="32" r="1.1" fill="#2dd4bf" opacity="0.5"/>
  <circle cx="180" cy="32" r="0.9" fill="#0d9488" opacity="0.35"/>
  <circle cx="620" cy="32" r="0.9" fill="#0d9488" opacity="0.35"/>

  <!-- Tiny Background Star Particles -->
  <circle cx="380" cy="19" r="0.8" fill="#ffffff" opacity="0.5">
    <animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="424" cy="46" r="0.7" fill="#5eead4" opacity="0.45">
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="360" cy="44" r="0.6" fill="#2dd4bf" opacity="0.4"/>
  <circle cx="440" cy="20" r="0.6" fill="#ffffff" opacity="0.4"/>

  <!-- ═════════ CENTER ORBITAL ASSEMBLY ═════════ -->
  <g transform="translate(400, 32)">
    <!-- Elliptical Orbit Track with Dynamic Tilt -->
    <ellipse rx="78" ry="18" transform="rotate(-3)" fill="none" stroke="#2dd4bf" stroke-width="0.85" stroke-dasharray="3 3.5" opacity="0.4"/>

    <!-- Center Rotating 5-Pointed Star Bit -->
    <g class="star-rot-orbit-divider-05">
      <!-- Soft Core Glow Behind Star -->
      <circle r="14" fill="#14b8a6" opacity="0.32"/>
      <!-- 10 Facets for 3D Gemstone Depth -->
      <polygon points="0,0 0.0,-12.0 3.06,-4.21" fill="#f0fdfa"/> <polygon points="0,0 3.06,-4.21 11.41,-3.71" fill="#5eead4"/> <polygon points="0,0 11.41,-3.71 4.95,1.61" fill="#2dd4bf"/> <polygon points="0,0 4.95,1.61 7.05,9.71" fill="#0d9488"/> <polygon points="0,0 7.05,9.71 0.0,5.2" fill="#115e59"/> <polygon points="0,0 0.0,5.2 -7.05,9.71" fill="#0d9488"/> <polygon points="0,0 -7.05,9.71 -4.95,1.61" fill="#2dd4bf"/> <polygon points="0,0 -4.95,1.61 -11.41,-3.71" fill="#5eead4"/> <polygon points="0,0 -11.41,-3.71 -3.06,-4.21" fill="#f0fdfa"/> <polygon points="0,0 -3.06,-4.21 0.0,-12.0" fill="#5eead4"/>
      <!-- Star-Bit Inner Facet Highlights -->
      <circle r="2.0" fill="#ffffff" opacity="0.95"/>
      <polygon points="0,-4.5 1.0,-1.0 4.5,0 1.0,1.0 0,4.5 -1.0,1.0 -4.5,0 -1.0,-1.0" fill="#ffffff" opacity="0.85"/>
    </g>

    <!-- Orbiting Satellite Body (Rotated with tilt) -->
    <g transform="rotate(-3)">
      
        <g>
          <!-- Ring behind -->
          <ellipse rx="6.5" ry="2.2" transform="rotate(-18)" fill="none" stroke="#f0fdfa" stroke-width="0.8" opacity="0.75"/>
          <circle r="2.6" fill="#2dd4bf"/>
          <!-- Ring front -->
          <path d="M -6.0,2.0 A 6.5,2.2 0 0,0 6.0,-2.0" transform="rotate(-18)" fill="none" stroke="#f0fdfa" stroke-width="0.8" opacity="0.95"/>
          <animateMotion dur="22s" repeatCount="indefinite" path="M -78,0 a 78,18 0 1,0 156,0 a 78,18 0 1,0 -156,0"/>
        </g>
        
    </g>
  </g>
</svg>
