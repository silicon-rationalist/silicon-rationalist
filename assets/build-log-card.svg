<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 170" width="100%" height="auto" style="width: 100%; height: auto; display: block;">
  <defs>
    <radialGradient id="bl-card-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#190e30"/>
      <stop offset="55%" stop-color="#100a22"/>
      <stop offset="100%" stop-color="#080414"/>
    </radialGradient>
    <linearGradient id="bl-top-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="25%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#f472b6" stop-opacity="0.85"/>
      <stop offset="75%" stop-color="#c084fc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="170" rx="10" fill="url(#bl-card-bg)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.35"/>
  <line x1="30" y1="1" x2="770" y2="1" stroke="url(#bl-top-glow)" stroke-width="1.8"/>

  <!-- Red, Yellow, Green Terminal Controls -->
  <line x1="0" y1="36" x2="800" y2="36" stroke="#7c3aed" stroke-width="0.75" stroke-opacity="0.25"/>
  <circle cx="24" cy="18" r="4.5" fill="#ff5f56"/>
  <circle cx="39" cy="18" r="4.5" fill="#ffbd2e"/>
  <circle cx="54" cy="18" r="4.5" fill="#27c93f"/>
  <text x="76" y="22" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="12" font-weight="700" fill="#f472b6" letter-spacing="1.5">&gt; BUILD LOG // SYSTEM METRICS</text>

  <text x="32" y="68" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13" fill="#f472b6">09 repositories indexed</text>
  <text x="32" y="90" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13" fill="#f0abfc">activity: evolving</text>
  <text x="32" y="112" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13" fill="#c4b5fd">account age: ~1 year</text>
  <text x="32" y="134" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13" fill="#a78bfa">green squares: honest</text>

  <text x="460" y="88" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="14" fill="#f472b6" font-weight="600">I'm still early.</text>
  <text x="460" y="112" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="15" fill="#ffffff" font-weight="700">But I build things.</text>
