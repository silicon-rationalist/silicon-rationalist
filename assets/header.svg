<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <!-- Scanline pattern -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="rgba(0,0,0,0.08)"/>
    </pattern>
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-strong">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="#0a0a12"/>
  <!-- Subtle purple gradient overlay -->
  <rect width="800" height="420" fill="url(#bg-grad)" opacity="0.6"/>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0b1a"/>
      <stop offset="50%" stop-color="#12101f"/>
      <stop offset="100%" stop-color="#0a0a12"/>
    </linearGradient>
  </defs>

  <!-- Grid lines -->
  <g opacity="0.04" stroke="#8b5cf6">
    <line x1="0" y1="80" x2="800" y2="80" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="800" y2="160" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="800" y2="240" stroke-width="0.5"/>
    <line x1="0" y1="320" x2="800" y2="320" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="420" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="420" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="420" stroke-width="0.5"/>
  </g>

  <!-- Corner brackets -->
  <g stroke="#8b5cf6" stroke-width="1.5" fill="none" opacity="0.3">
    <!-- Top-left -->
    <polyline points="20,45 20,25 40,25"/>
    <!-- Top-right -->
    <polyline points="760,25 780,25 780,45"/>
    <!-- Bottom-left -->
    <polyline points="20,375 20,395 40,395"/>
    <!-- Bottom-right -->
    <polyline points="760,395 780,395 780,375"/>
  </g>

  <!-- Top status bar -->
  <text x="30" y="18" font-family="'Courier New', monospace" font-size="9" fill="#3b2d6b" letter-spacing="3">
    SYS.PROFILE // PROCESS 001 // BLR.NODE
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.2s" fill="freeze"/>
  </text>

  <!-- Boot sequence line 1 -->
  <text x="40" y="70" font-family="'Courier New', monospace" font-size="10" fill="#4ade80" opacity="0" filter="url(#glow)">
    &gt; INITIALIZING SYSTEM...
    <animate attributeName="opacity" values="0;0.6" dur="0.3s" begin="0.5s" fill="freeze"/>
  </text>

  <!-- Boot sequence line 2 -->
  <text x="40" y="90" font-family="'Courier New', monospace" font-size="10" fill="#4ade80" opacity="0" filter="url(#glow)">
    &gt; LOADING USER PROFILE...
    <animate attributeName="opacity" values="0;0.6" dur="0.3s" begin="1s" fill="freeze"/>
  </text>

  <!-- Boot sequence line 3 -->
  <text x="40" y="110" font-family="'Courier New', monospace" font-size="10" fill="#4ade80" opacity="0" filter="url(#glow)">
    &gt; USER FOUND.
    <animate attributeName="opacity" values="0;0.8" dur="0.3s" begin="1.5s" fill="freeze"/>
  </text>

  <!-- Main name block -->
  <g opacity="0" filter="url(#glow-strong)">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="2s" fill="freeze"/>
    <text x="400" y="185" font-family="'Courier New', monospace" font-size="52" fill="#e2e8f0" text-anchor="middle" font-weight="bold" letter-spacing="8">
      RAKSHAN
    </text>
  </g>

  <!-- Handle line -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.5s" fill="freeze"/>
    <text x="400" y="215" font-family="'Courier New', monospace" font-size="14" fill="#8b5cf6" text-anchor="middle" letter-spacing="5">
      silicon-rationalist
    </text>
  </g>

  <!-- Divider line -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.8s" fill="freeze"/>
    <line x1="250" y1="235" x2="550" y2="235" stroke="#8b5cf6" stroke-width="0.5" opacity="0.4"/>
  </g>

  <!-- Tagline -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="3s" fill="freeze"/>
    <text x="400" y="260" font-family="'Courier New', monospace" font-size="11" fill="#94a3b8" text-anchor="middle" letter-spacing="1">
      Professional over-thinker solving my own inefficiencies.
    </text>
  </g>

  <!-- Status indicators -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.5s" fill="freeze"/>
    <!-- Location -->
    <circle cx="255" cy="300" r="3" fill="#4ade80">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="265" y="303" font-family="'Courier New', monospace" font-size="10" fill="#64748b">
      BLR // BENGALURU
    </text>
    <!-- Build count -->
    <text x="450" y="303" font-family="'Courier New', monospace" font-size="10" fill="#64748b">
      BUILDS: <tspan fill="#4ade80">09</tspan>
    </text>
    <!-- Status -->
    <text x="570" y="303" font-family="'Courier New', monospace" font-size="10" fill="#64748b">
      STATUS: <tspan fill="#4ade80">ONLINE</tspan>
    </text>
  </g>

  <!-- Bottom boot complete -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="4s" fill="freeze"/>
    <text x="40" y="365" font-family="'Courier New', monospace" font-size="9" fill="#4ade80" opacity="0.5">
      &gt; 09 builds indexed. toolkit loaded. system ready.
    </text>
  </g>

  <!-- Blinking cursor -->
  <rect x="435" y="355" width="7" height="12" fill="#4ade80" opacity="0">
    <animate attributeName="opacity" values="0;0;0.8;0;0.8;0" dur="1s" begin="4.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Bottom right timestamp -->
  <text x="760" y="405" font-family="'Courier New', monospace" font-size="8" fill="#3b2d6b" text-anchor="end" letter-spacing="2">
    v1.0 // 2026
  </text>

  <!-- Scanline overlay -->
  <rect width="800" height="420" fill="url(#scanlines)" opacity="0.15"/>
</svg>
