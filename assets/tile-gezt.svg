<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 225" width="100%" height="auto" style="width: 100%; height: auto; display: block;">
  <defs>
    <radialGradient id="gezt-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#261448"/>
      <stop offset="55%" stop-color="#190c30"/>
      <stop offset="100%" stop-color="#10061e"/>
    </radialGradient>
    <linearGradient id="gezt-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="35%" stop-color="#f472b6" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#f0abfc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Lighter Purple & Pink Tile Card -->
  <rect width="420" height="225" rx="8" fill="url(#gezt-bg)" stroke="#c084fc" stroke-width="1" stroke-opacity="0.45"/>
  <line x1="20" y1="1" x2="400" y2="1" stroke="url(#gezt-glow)" stroke-width="2"/>

  <!-- Header Bar -->
  <line x1="0" y1="34" x2="420" y2="34" stroke="#a855f7" stroke-width="0.6" stroke-opacity="0.3"/>
  <circle cx="20" cy="18" r="3.5" fill="#f472b6" opacity="0.9"/>
  <circle cx="31" cy="18" r="3.5" fill="#c084fc" opacity="0.75"/>
  <circle cx="42" cy="18" r="3.5" fill="#7c3aed" opacity="0.6"/>
  <text x="56" y="22" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="11" font-weight="700" fill="#f472b6" letter-spacing="1.2">UTILITY // WEB // TAX</text>

  <!-- Live Green Circle Indicator -->
  <circle cx="348" cy="18" r="3.5" fill="#10b981">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="358" y="22" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="11" font-weight="700" fill="#34d399" letter-spacing="1">LIVE</text>

  <!-- Project Title (Readable Big) -->
  <text x="18" y="59" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="18" font-weight="700" fill="#ffffff">◈ GEZT <tspan fill="#f472b6">↗</tspan></text>

  <!-- Details Box with Larger Readable Text -->
  <rect x="14" y="72" width="392" height="84" rx="6" fill="#130826" stroke="#c084fc" stroke-width="0.5" stroke-opacity="0.35"/>
  <text x="24" y="96" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13.5" fill="#f5f3ff">GST filing with simplified modern UX.</text>
  <text x="24" y="118" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13.5" fill="#e9d5ff">Eliminates bureaucratic friction &amp;</text>
  <text x="24" y="140" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13.5" fill="#ddd6fe">makes compliance fast &amp; intuitive.</text>

  <!-- Tech Stack Box with Natural Spacing -->
  <rect x="14" y="166" width="392" height="42" rx="6" fill="#190c33" stroke="#f472b6" stroke-width="0.5" stroke-opacity="0.35"/>
  <text x="24" y="192" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="11" font-weight="700" fill="#f472b6" letter-spacing="1.2">STACK</text>
  <text x="74" y="192" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="12.5" fill="#ffffff">JavaScript <tspan fill="#f0abfc">·</tspan> Web APIs <tspan fill="#f0abfc">·</tspan> CSS3 <tspan fill="#f0abfc">·</tspan> Vercel</text>
</svg>
