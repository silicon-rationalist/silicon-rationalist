<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 170" width="100%" height="auto" style="width: 100%; height: auto; display: block;">
  <defs>
    <radialGradient id="id-card-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#160f2e"/>
      <stop offset="55%" stop-color="#0e0a20"/>
      <stop offset="100%" stop-color="#080514"/>
    </radialGradient>
    <linearGradient id="id-top-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="30%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Deep Purple Card Background with Rounded Edges -->
  <rect width="800" height="170" rx="10" fill="url(#id-card-bg)" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.35"/>
  <line x1="40" y1="1" x2="760" y2="1" stroke="url(#id-top-glow)" stroke-width="1.5"/>

  <!-- Terminal Top Bar with Canonical Red, Yellow, Green Controls -->
  <line x1="0" y1="36" x2="800" y2="36" stroke="#7c3aed" stroke-width="0.75" stroke-opacity="0.25"/>
  <circle cx="24" cy="18" r="4.5" fill="#ff5f56"/>
  <circle cx="39" cy="18" r="4.5" fill="#ffbd2e"/>
  <circle cx="54" cy="18" r="4.5" fill="#27c93f"/>
  <text x="76" y="22" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="12" font-weight="700" fill="#c4b5fd" letter-spacing="1.5">&gt; IDENTITY</text>

  <!-- Content in Rich Purple Shades -->
  <text x="32" y="68" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="14" fill="#ddd6fe" letter-spacing="0.5">I notice small things that could work better,</text>
  <text x="32" y="92" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="14" fill="#ddd6fe" letter-spacing="0.5">overthink them for an unreasonable time,</text>
  <text x="32" y="116" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="14" fill="#ddd6fe" letter-spacing="0.5">and eventually build something about it.</text>

  <text x="32" y="148" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="14" fill="#a78bfa" letter-spacing="0.5">Most of my projects exist because a process annoyed me enough.</text>
</svg>
