<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 60" width="800" height="60">
  <defs>
    <linearGradient id="footer-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="20%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.3"/>
      <stop offset="80%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="15" x2="800" y2="15" stroke="url(#footer-line)" stroke-width="0.5"/>
  <text x="400" y="42" font-family="'Courier New', monospace" font-size="10" fill="#4b5563" text-anchor="middle" letter-spacing="4">
    NO FINAL VERSION DETECTED. STILL BUILDING.
  </text>
  <circle cx="400" cy="55" r="1.5" fill="#a78bfa" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
