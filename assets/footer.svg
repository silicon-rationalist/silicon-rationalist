<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 60" width="100%" height="auto" style="width: 100%; height: auto; display: block;">
  <defs>
    <linearGradient id="footer-orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="20%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#c4b5fd" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>
  <line x1="40" y1="16" x2="760" y2="16" stroke="url(#footer-orbit)" stroke-width="1.2"/>
  <text x="400" y="38" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="11" font-weight="600" fill="#c4b5fd" text-anchor="middle" letter-spacing="3.5">
    NO FINAL VERSION DETECTED. STILL BUILDING.
  </text>
  <!-- Orbital pulse indicator -->
  <circle cx="400" cy="50" r="2.2" fill="#a78bfa" opacity="0.7">
    <animate attributeName="opacity" values="0.25;0.95;0.25" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1.8;2.8;1.8" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="384" cy="50" r="1.1" fill="#8b5cf6" opacity="0.45"/>
  <circle cx="416" cy="50" r="1.1" fill="#8b5cf6" opacity="0.45"/>
</svg>
