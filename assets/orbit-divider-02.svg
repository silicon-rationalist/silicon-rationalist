<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 64" width="100%" height="auto" style="width: 100%; height: auto; display: block;">
  <style>
    @keyframes rot_orbit-divider-02 {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    .star-rot-orbit-divider-02 {
      transform-origin: 0px 0px;
      animation: rot_orbit-divider-02 18s linear infinite;
    }
  </style>

  <defs>
    <!-- Linear Gradient fading to transparent left and right -->
    <linearGradient id="orbit-div-grad-orbit-divider-02" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0"/>
      <stop offset="12%" stop-color="#0284c7" stop-opacity="0.18"/>
      <stop offset="28%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="44%" stop-color="#7dd3fc" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#f0f9ff" stop-opacity="0.95"/>
      <stop offset="56%" stop-color="#7dd3fc" stop-opacity="0.85"/>
      <stop offset="72%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="88%" stop-color="#0284c7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>

    <!-- Center Radial Glow -->
    <radialGradient id="center-glow-orbit-divider-02" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.48"/>
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Center Aura -->
  <ellipse cx="400" cy="32" rx="120" ry="28" fill="url(#center-glow-orbit-divider-02)"/>

  <!-- Horizontal Beam with Left & Right Fade (Optical Glow Layer) -->
  <line x1="0" y1="32" x2="800" y2="32" stroke="url(#orbit-div-grad-orbit-divider-02)" stroke-width="2.8" opacity="0.35"/>

  <!-- Left & Right Fading Core Axis Line -->
  <line x1="0" y1="32" x2="800" y2="32" stroke="url(#orbit-div-grad-orbit-divider-02)" stroke-width="1.2"/>

  <!-- Subtle Vector Ticks & Coordinate Accents -->
  <g opacity="0.7" stroke="#38bdf8" stroke-width="0.75">
    <line x1="310" y1="30" x2="310" y2="34"/>
    <line x1="490" y1="30" x2="490" y2="34"/>
    <line x1="220" y1="30.5" x2="220" y2="33.5" opacity="0.45"/>
    <line x1="580" y1="30.5" x2="580" y2="33.5" opacity="0.45"/>
    <line x1="140" y1="31" x2="140" y2="33" opacity="0.25"/>
    <line x1="660" y1="31" x2="660" y2="33" opacity="0.25"/>
  </g>

  <!-- Flanking Orbit Dots with Fading Opacity -->
  <circle cx="340" cy="32" r="1.4" fill="#38bdf8" opacity="0.7"/>
  <circle cx="460" cy="32" r="1.4" fill="#38bdf8" opacity="0.7"/>
  <circle cx="280" cy="32" r="1.1" fill="#38bdf8" opacity="0.5"/>
  <circle cx="520" cy="32" r="1.1" fill="#38bdf8" opacity="0.5"/>
  <circle cx="180" cy="32" r="0.9" fill="#0284c7" opacity="0.35"/>
  <circle cx="620" cy="32" r="0.9" fill="#0284c7" opacity="0.35"/>

  <!-- Tiny Background Star Particles -->
  <circle cx="380" cy="19" r="0.8" fill="#ffffff" opacity="0.5">
    <animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="424" cy="46" r="0.7" fill="#7dd3fc" opacity="0.45">
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="360" cy="44" r="0.6" fill="#38bdf8" opacity="0.4"/>
  <circle cx="440" cy="20" r="0.6" fill="#ffffff" opacity="0.4"/>

  <!-- ═════════ CENTER ORBITAL ASSEMBLY ═════════ -->
  <g transform="translate(400, 32)">
    <!-- Elliptical Orbit Track with Dynamic Tilt -->
    <ellipse rx="72" ry="17" transform="rotate(3)" fill="none" stroke="#38bdf8" stroke-width="0.85" stroke-dasharray="3 3.5" opacity="0.4"/>

    <!-- Center Rotating 5-Pointed Star Bit -->
    <g class="star-rot-orbit-divider-02">
      <!-- Soft Core Glow Behind Star -->
      <circle r="14" fill="#38bdf8" opacity="0.32"/>
      <!-- 10 Facets for 3D Gemstone Depth -->
      <polygon points="0,0 0.0,-12.0 3.06,-4.21" fill="#f0f9ff"/> <polygon points="0,0 3.06,-4.21 11.41,-3.71" fill="#7dd3fc"/> <polygon points="0,0 11.41,-3.71 4.95,1.61" fill="#38bdf8"/> <polygon points="0,0 4.95,1.61 7.05,9.71" fill="#0284c7"/> <polygon points="0,0 7.05,9.71 0.0,5.2" fill="#0369a1"/> <polygon points="0,0 0.0,5.2 -7.05,9.71" fill="#0284c7"/> <polygon points="0,0 -7.05,9.71 -4.95,1.61" fill="#38bdf8"/> <polygon points="0,0 -4.95,1.61 -11.41,-3.71" fill="#7dd3fc"/> <polygon points="0,0 -11.41,-3.71 -3.06,-4.21" fill="#f0f9ff"/> <polygon points="0,0 -3.06,-4.21 0.0,-12.0" fill="#7dd3fc"/>
      <!-- Star-Bit Inner Facet Highlights -->
      <circle r="2.0" fill="#ffffff" opacity="0.95"/>
      <polygon points="0,-4.5 1.0,-1.0 4.5,0 1.0,1.0 0,4.5 -1.0,1.0 -4.5,0 -1.0,-1.0" fill="#ffffff" opacity="0.85"/>
    </g>

    <!-- Orbiting Satellite Body (Rotated with tilt) -->
    <g transform="rotate(3)">
      
        <g>
          <circle r="5.2" fill="#38bdf8" opacity="0.35"/>
          <circle r="2.8" fill="#38bdf8"/>
          <circle cx="-0.8" cy="-0.8" r="1.1" fill="#ffffff" opacity="0.9"/>
          <animateMotion dur="18s" repeatCount="indefinite" path="M -72,0 a 72,17 0 1,0 144,0 a 72,17 0 1,0 -144,0"/>
        </g>
        
    </g>
  </g>
</svg>
